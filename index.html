<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude CLI Interactive Tutorial</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        #terminal {
            background-color: #000;
            width: 100%;
            max-width: 800px;
            height: 450px;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow-y: auto;
            border: 1px solid #333;
        }
        .output { margin-bottom: 10px; line-height: 1.4; }
        .command { color: #00ff00; }
        .hint { color: #888; font-style: italic; }
        .input-line { display: flex; align-items: center; }
        .prompt { color: #00ff00; margin-right: 10px; }
        input {
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            flex-grow: 1;
        }
        #header { text-align: center; margin-bottom: 20px; }
        h1 { color: #ff69b4; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div id="header">
        <h1>Claude CLI Tutorial</h1>
        <p>Type the commands to learn how to use the Claude CLI!</p>
    </div>
    <div id="terminal">
        <div id="history">
            <div class="output">Welcome to the interactive Claude CLI tutorial.</div>
            <div class="output hint">Objective: Start by typing 'claude' to see available commands.</div>
        </div>
        <div class="input-line">
            <span class="prompt">mahbub@chula:~$</span>
            <input type="text" id="commandInput" autofocus autocomplete="off">
        </div>
    </div>
    <script>
        const input = document.getElementById('commandInput');
        const history = document.getElementById('history');
        const terminal = document.getElementById('terminal');
        let step = 0;
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const cmd = input.value.trim().toLowerCase();
                processCommand(cmd);
                input.value = '';
                terminal.scrollTop = terminal.scrollHeight;
            }
        });
        function addLine(text, className = 'output') {
            const div = document.createElement('div');
            div.className = className;
            div.innerHTML = text;
            history.appendChild(div);
        }
        function processCommand(cmd) {
            addLine('<span class="prompt">mahbub@chula:~$</span> ' + cmd);
            if (step === 0) {
                if (cmd === 'claude') {
                    addLine("Claude CLI v1.0.0 initialized...");
                    addLine("Usage: claude [command] [options]");
                    addLine("<br>Available Commands:");
                    addLine("- chat : Start a conversation");
                    addLine("- config : Set your API keys");
                    addLine("- help : Show this help menu");
                    addLine("<br><span class='hint'>Next Step: Type 'claude config' to set up your account.</span>");
                    step = 1;
                } else { addLine("Command not found. Try typing 'claude'.", "command"); }
            } else if (step === 1) {
                if (cmd === 'claude config') {
                    addLine("Configuration Menu:");
                    addLine("Enter your Anthropic API Key: ****************");
                    addLine("Success! Config saved to ~/.claude/config.json");
                    addLine("<br><span class='hint'>Final Step: Type 'claude chat' to start talking to the AI!</span>");
                    step = 2;
                } else { addLine("Invalid command. Please type 'claude config'."); }
            } else if (step === 2) {
                if (cmd === 'claude chat') {
                    addLine("Connecting to Claude-3-Sonnet...");
                    addLine("<span style='color:#ff69b4'>Claude:</span> Hello Mahbub! I am ready to help you with your research at Chula. What shall we do today?");
                    addLine("<br>?? <b>Tutorial Complete!</b> You are now a Claude CLI expert.");
                    step = 3;
                } else { addLine("Type 'claude chat' to finish the tutorial."); }
            }
        }
    </script>
</body>
</html>
